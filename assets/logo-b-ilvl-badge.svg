<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Simple Loot Info">
  <title>Simple Loot Info</title>
  <defs>
    <radialGradient id="b-bg" cx="50%" cy="34%" r="78%">
      <stop offset="0%" stop-color="#3b3022"/>
      <stop offset="100%" stop-color="#0f0d09"/>
    </radialGradient>
    <linearGradient id="b-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffeaa9"/>
      <stop offset="45%" stop-color="#e6b243"/>
      <stop offset="100%" stop-color="#8a5710"/>
    </linearGradient>
    <linearGradient id="b-gem" x1="0.15" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#dda6ff"/>
      <stop offset="52%" stop-color="#a335ee"/>
      <stop offset="100%" stop-color="#571496"/>
    </linearGradient>
    <radialGradient id="b-glow" cx="50%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#a335ee" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#a335ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#b-bg)"/>
  <rect x="9" y="9" width="494" height="494" rx="104" fill="none" stroke="url(#b-gold)" stroke-width="10"/>

  <!-- item icon frame -->
  <rect x="116" y="72" width="280" height="280" rx="42" fill="#14100b"/>
  <rect x="116" y="72" width="280" height="280" rx="42" fill="url(#b-glow)"/>
  <rect x="116" y="72" width="280" height="280" rx="42" fill="none" stroke="url(#b-gold)" stroke-width="12"/>
  <rect x="136" y="92" width="240" height="240" rx="28" fill="none" stroke="#a335ee" stroke-width="4" opacity="0.85"/>

  <!-- gem -->
  <path d="M256 128 L330 194 L291 286 L221 286 L182 194 Z" fill="url(#b-gem)"/>
  <path d="M256 128 L291 192 L256 219 L221 192 Z" fill="#ffffff" opacity="0.3"/>

  <!-- ilvl ribbon -->
  <rect x="56" y="332" width="400" height="106" rx="22" fill="#14100b" stroke="url(#b-gold)" stroke-width="9"/>
  <text x="256" y="406" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="58"
        letter-spacing="4" fill="url(#b-gold)">ILVL 639</text>
</svg>
