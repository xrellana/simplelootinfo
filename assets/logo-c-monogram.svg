<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Simple Loot Info">
  <title>Simple Loot Info</title>
  <defs>
    <radialGradient id="c-bg" cx="50%" cy="34%" r="78%">
      <stop offset="0%" stop-color="#3b3022"/>
      <stop offset="100%" stop-color="#0f0d09"/>
    </radialGradient>
    <linearGradient id="c-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffeaa9"/>
      <stop offset="45%" stop-color="#e6b243"/>
      <stop offset="100%" stop-color="#8a5710"/>
    </linearGradient>
    <linearGradient id="c-gem" x1="0.15" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#dda6ff"/>
      <stop offset="52%" stop-color="#a335ee"/>
      <stop offset="100%" stop-color="#571496"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#c-bg)"/>
  <rect x="9" y="9" width="494" height="494" rx="104" fill="none" stroke="url(#c-gold)" stroke-width="10"/>
  <rect x="34" y="34" width="444" height="444" rx="86" fill="none" stroke="url(#c-gold)" stroke-width="3" opacity="0.4"/>

  <!-- gem crest -->
  <path d="M256 112 L284 137 L269 180 L243 180 L228 137 Z" fill="url(#c-gem)"/>
  <path d="M256 112 L269 136 L256 147 L243 136 Z" fill="#ffffff" opacity="0.3"/>

  <!-- monogram -->
  <text x="256" y="326" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="164"
        letter-spacing="2" fill="url(#c-gold)">SLI</text>

  <!-- divider -->
  <rect x="152" y="350" width="208" height="4" rx="2" fill="url(#c-gold)" opacity="0.7"/>

  <!-- wordmark -->
  <text x="256" y="398" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-weight="400" font-size="30"
        letter-spacing="9" fill="#d8c9a6" opacity="0.85">LOOT INFO</text>
</svg>
