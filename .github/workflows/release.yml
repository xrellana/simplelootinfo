name: Release addon

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Package and publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6

      - name: Validate version
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must use the vX.Y.Z format; received '${tag}'." >&2
            exit 1
          fi

          version="${tag#v}"
          toc_version="$(sed -n 's/^## Version:[[:space:]]*//p' SimpleLootInfo.toc | tr -d '\r' | head -n 1)"

          if [[ -z "${toc_version}" ]]; then
            echo "SimpleLootInfo.toc does not contain a Version field." >&2
            exit 1
          fi

          if [[ "${toc_version}" != "${version}" ]]; then
            echo "Tag version ${version} does not match TOC version ${toc_version}." >&2
            exit 1
          fi

      - name: Build release archive
        shell: bash
        run: |
          set -euo pipefail

          archive="SimpleLootInfo-${GITHUB_REF_NAME}.zip"
          mkdir -p dist/SimpleLootInfo
          install -m 0644 SimpleLootInfo.lua SimpleLootInfo.toc dist/SimpleLootInfo/
          (cd dist && zip -r "../${archive}" SimpleLootInfo)

          echo "Archive contents:"
          unzip -Z1 "${archive}"
          echo "ARCHIVE_NAME=${archive}" >> "${GITHUB_ENV}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "${ARCHIVE_NAME}" \
            --verify-tag \
            --generate-notes \
            --title "SimpleLootInfo ${GITHUB_REF_NAME}"
